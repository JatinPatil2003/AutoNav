# DEV-MODE variant of platform-server.autonav.in.conf.
# Proxies to the developer's laptop over the OpenVPN tunnel instead of to
# the local platform-backend container, while PlatformServer runs locally
# during development. See:
#   docs/Development Mode - Laptop Reverse Proxy + Remote MongoDB.md
#
# Swap this in/out via the sites-enabled symlink (see that doc) — do NOT
# leave this enabled once dev mode ends; re-point the symlink back at
# platform-server.autonav.in.conf.
#
# Reuses the existing wildcard *.autonav.in Cloudflare Origin cert already
# present on this host (see docs/OpenVPN Access Server + Nginx + Cloudflare Setup.md).

server {
    listen 80;
    server_name platform-server.autonav.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name platform-server.autonav.in;

    ssl_certificate     /etc/nginx/ssl/autonav/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/autonav/privkey.pem;

    # systemd-resolved stub (see the dynamic robot DNS doc) — re-resolve
    # dummy-server.robot on every request rather than caching it for the
    # life of the nginx worker, since the laptop's VPN IP can change on
    # reconnect.
    resolver 127.0.0.53 valid=5s;
    set $dev_upstream "dummy-server.robot";

    # Robot<->platform service-to-service APIs ("no secret, the VPN is the
    # trust boundary" by design) must never be reachable from the public
    # internet - only from platform.internal over the VPN. Block them here
    # before the generic /api/ proxy below.
    location ~ ^/api/(robot-auth|platform-auth)/ {
        return 404;
    }

    location /ws/control {
        # No URI component after $dev_upstream:4000 — nginx only does its
        # "replace the matched location prefix, append the rest of the URI"
        # rewrite when proxy_pass's host is a literal; with a variable (as
        # here, since dummy-server.robot's IP can change), any URI written
        # here would be forwarded verbatim regardless of the actual request
        # path, dropping anything past it. Omitting it passes the original
        # request URI through unchanged instead.
        proxy_pass http://$dev_upstream:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 75s;
    }

    # /ws/robot-link (RobotServer <-> PlatformServer persistent connection)
    # is intentionally NOT proxied here - it is only reachable internally,
    # over the VPN, at platform.internal:4000 directly.

    location /api/ {
        # See the /ws/control comment above re: no URI component with a
        # variable upstream — this passes the original request path
        # (e.g. /api/docs) through unchanged instead of literally "/api/".
        proxy_pass http://$dev_upstream:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
    }
}
