# EC2 nginx server block for the AutoNav operator dashboard frontend.
# HTTPS only: the port-80 block below exists solely to redirect to HTTPS.
# Reuses the existing wildcard *.autonav.in Cloudflare Origin cert already
# present on this host (see docs/OpenVPN Access Server + Nginx + Cloudflare Setup.md).
#
# The API lives on its own subdomain — see platform-server.autonav.in.conf.

server {
    listen 80;
    server_name dashboard.autonav.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dashboard.autonav.in;

    ssl_certificate     /etc/nginx/ssl/autonav/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/autonav/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
