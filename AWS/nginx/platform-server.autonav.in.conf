# EC2 nginx server block for the AutoNav PlatformServer API.
# HTTPS only: the port-80 block below exists solely to redirect to HTTPS.
# Reuses the existing wildcard *.autonav.in Cloudflare Origin cert already
# present on this host (see docs/OpenVPN Access Server + Nginx + Cloudflare Setup.md).
#
# The dashboard frontend lives on its own subdomain — see dashboard.autonav.in.conf.

server {
    listen 80;
    server_name platform-server.autonav.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name platform-server.autonav.in;

    ssl_certificate     /etc/nginx/ssl/autonav/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/autonav/privkey.pem;

    # /api/platform-auth belongs to RobotServer, not this PlatformServer
    # process — it's never actually reachable through this domain either
    # way, since PlatformServer calls each robot directly over the VPN by
    # vpnHostname (see HttpRobotNotifier). Block it here anyway as
    # defense-in-depth in case that ever changes.
    #
    # /api/robot-auth/* is now publicly reachable (see /api/ below):
    # resolveRobot.middleware.ts requires ROBOT_LINK_SECRET, the same
    # credential /ws/robot-link uses, so it's no longer VPN-only.
    location ~ ^/api/platform-auth/ {
        return 404;
    }

    # Both /ws/control (dashboard<->robot teleop) and /ws/robot-link
    # (RobotServer<->PlatformServer persistent connection) are proxied here.
    # /ws/control authenticates via session cookie; /ws/robot-link via
    # ROBOT_LINK_SECRET (robotLinkGateway.authenticate) - neither relies on
    # the VPN as a trust boundary, so exposing them publicly is safe. Any
    # new /ws/* route added later is public-by-default under this block.
    location /ws/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 75s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Cookie $http_cookie;
    }
}
