services:
  platform-mongo:
    image: mongo:9.0.2
    container_name: platform-mongo
    restart: unless-stopped
    networks: [platform-net]
    volumes:
      - platform-mongo-data:/data/db
    env_file: .env
    ports:
      - "27017:27017"
    # Published for remote dev access (laptop-hosted PlatformServer connects
    # to platform-mongodb.autonav.in:27017 while developing — see
    # docs/Development Mode - Laptop Reverse Proxy + Remote MongoDB.md).
    # Auth is already enforced via MONGO_INITDB_ROOT_USERNAME/PASSWORD above,
    # but the EC2 security group should still scope inbound 27017 to known
    # IPs rather than leaving it open to 0.0.0.0/0.

  platform-backend:
    image: ${DOCKER_USERNAME}/autonav:platform-backend
    container_name: platform-backend
    restart: unless-stopped
    networks: [platform-net]
    ports:
      - "4000:4000"
    env_file: .env
    depends_on: [platform-mongo]
    volumes:
      # Bind mount (not a named volume) so they land at a predictable path
      # on the EC2 host — AWS/scripts/compress-old-logs.sh (run via cron)
      # gzip-compresses the older rotated files from here.
      - ./logs/platform-backend:/app/logs

  platform-frontend:
    image: ${DOCKER_USERNAME}/autonav:platform-frontend
    container_name: platform-frontend
    restart: unless-stopped
    networks: [platform-net]
    ports:
      - "8081:80"
    depends_on: [platform-backend]

networks:
  platform-net:
    driver: bridge

volumes:
  platform-mongo-data:
