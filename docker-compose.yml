# Modular robot-side stack: one container per subsystem, all built FROM the
# shared ROS base image (docker/base.Dockerfile), published as
# jatinpatil2003/autonav:base. To build and run everything straight from that
# published base:
#
#   docker compose build
#   docker compose up -d
#
# When iterating on docker/base.Dockerfile itself, build it locally and
# point the subsystem builds at your local tag instead of the published one:
#
#   docker build -f docker/base.Dockerfile -t autonav-ros-base:dev .
#   BASE_IMAGE=autonav-ros-base:dev docker compose build
#
# See docker-compose.dev.yml for rviz/debug tooling, which is not meant to
# run on the robot itself.

services:
  autonav-mongodb:
    image: mongo:9.0.2
    container_name: autonav-mongodb
    ports:
      - 27017:27017
    volumes:
      - ~/mongodb_data:/data/db
    restart: unless-stopped

  autonav-firmware:
    # Replaces the old micro-ROS agent: the ESP32 firmware now speaks a
    # custom serial protocol (see autonav_firmware/src/esp32_bridge_node.cpp)
    # instead of micro-ROS, bridged by this node over /dev/esp.
    build:
      context: .
      dockerfile: docker/firmware.Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-jatinpatil2003/autonav:base}
    image: jatinpatil2003/autonav:firmware
    container_name: autonav-firmware
    privileged: true
    network_mode: host
    ipc: host
    user: "1000:1000"
    volumes:
      - /dev/esp:/dev/esp
    restart: unless-stopped

  autonav-utils:
    # Always-on utilities, decoupled from controller/navigation's own
    # lifecycles: the cmd_vel safety-timeout watchdog and the system
    # liveness heartbeat. See autonav_utils/.
    build:
      context: .
      dockerfile: docker/utils.Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-jatinpatil2003/autonav:base}
    image: jatinpatil2003/autonav:utils
    container_name: autonav-utils
    network_mode: host
    ipc: host
    user: "1000:1000"
    restart: unless-stopped

  autonav-lidar:
    build:
      context: .
      dockerfile: docker/lidar.Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-jatinpatil2003/autonav:base}
    image: jatinpatil2003/autonav:lidar
    container_name: autonav-lidar
    network_mode: host
    ipc: host
    privileged: true
    user: "1000:1000"
    volumes:
      - /dev/lidar:/dev/lidar
    restart: unless-stopped

  autonav-imu:
    build:
      context: .
      dockerfile: docker/imu.Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-jatinpatil2003/autonav:base}
    image: jatinpatil2003/autonav:imu
    container_name: autonav-imu
    network_mode: host
    ipc: host
    privileged: true
    user: "1000:1000"
    volumes:
      - /dev/imu:/dev/imu
    restart: unless-stopped

  autonav-controller:
    build:
      context: .
      dockerfile: docker/controller.Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-jatinpatil2003/autonav:base}
    image: jatinpatil2003/autonav:controller
    container_name: autonav-controller
    network_mode: host
    ipc: host
    privileged: true
    user: "1000:1000"
    volumes:
      - /dev/esp:/dev/esp
    restart: unless-stopped

  autonav-localization:
    build:
      context: .
      dockerfile: docker/localization.Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-jatinpatil2003/autonav:base}
    image: jatinpatil2003/autonav:localization
    container_name: autonav-localization
    network_mode: host
    ipc: host
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      - autonav-imu
      - autonav-controller

  autonav-navigation:
    build:
      context: .
      dockerfile: docker/navigation.Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-jatinpatil2003/autonav:base}
    image: jatinpatil2003/autonav:navigation
    container_name: autonav-navigation
    network_mode: host
    ipc: host
    privileged: true
    user: "1000:1000"
    environment:
      - NAV_MODE=navigation
    volumes:
      - ./RobotServer/maps:/colcon_ws/maps
    restart: unless-stopped
    depends_on:
      - autonav-lidar
      - autonav-localization

  autonav-robotserver:
    build:
      context: .
      dockerfile: RobotServer/Dockerfile
    image: jatinpatil2003/autonav:robotserver
    container_name: autonav-robotserver
    network_mode: host
    ipc: host
    user: "1000:1000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - MONGO_URI=mongodb://localhost:27017/autonav
      - CORS_ORIGINS=
      - MAPS_DIR=/app/maps
      - RUNTIME_DIR=/app/runtime
      - CAMERA_DEVICE=/dev/robotcam
      - PLATFORM_BASE_URL=${PLATFORM_BASE_URL}
      - ROBOT_LINK_SECRET=${ROBOT_LINK_SECRET}
      - ROSTER_SYNC_INTERVAL_MINUTES=60
      - ROBOT_SESSION_ACCESS_SECRET=${ROBOT_SESSION_ACCESS_SECRET}
      - ROBOT_SESSION_REFRESH_SECRET=${ROBOT_SESSION_REFRESH_SECRET}
      - ROBOT_SESSION_ACCESS_TTL=15m
      - ROBOT_SESSION_REFRESH_TTL=24h
      - PIN_LOGIN_MAX_ATTEMPTS=5
      - PIN_LOGIN_LOCKOUT_MINUTES=15
    volumes:
      - /dev/robotcam:/dev/robotcam
      - ./RobotServer/maps:/app/maps
      # Small persisted runtime state (rotated ROBOT_LINK_SECRET override,
      # the reboot trigger file) — see config/linkSecretStore.ts and
      # modules/system/maintenance/maintenance.service.ts. The reboot
      # trigger's host path must match deploy/maintenance/autonav-reboot.path.
      - ./RobotServer/runtime:/app/runtime
    restart: unless-stopped
    depends_on:
      - autonav-mongodb
      - autonav-navigation

  autonav-robotapp:
    build:
      context: .
      dockerfile: RobotApp/Dockerfile
    image: jatinpatil2003/autonav:robotapp
    container_name: autonav-robotapp
    network_mode: host
    restart: unless-stopped
    depends_on:
      - autonav-robotserver
