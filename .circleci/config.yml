version: 2.1

executors:
  docker-publisher:
    docker:
      - image: jdrouet/docker-with-buildx:stable

jobs:
  build:
    executor: docker-publisher
    environment:
      IMAGE_NAME: jatinpatil2003/autonav
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Set up QEMU
          command: |
            docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - run:
          name: Set up Docker Buildx
          command: |
            docker buildx create --name mybuilder
            docker buildx use mybuilder
            docker buildx inspect --bootstrap
      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - run:
          name: Build and push the shared ROS base image
          command: |
            docker buildx build \
              --platform=linux/arm64,linux/amd64 \
              --cache-from type=registry,ref=$IMAGE_NAME:base-cache \
              --cache-to type=registry,ref=$IMAGE_NAME:base-cache,mode=max \
              --push \
              -t $IMAGE_NAME:base \
              -f docker/base.Dockerfile \
              .
      - run:
          name: Build and push the modular ROS subsystem images
          command: |
            for service in lidar imu controller localization navigation; do
              docker buildx build \
                --platform=linux/arm64,linux/amd64 \
                --build-arg BASE_IMAGE=$IMAGE_NAME:base \
                --cache-from type=registry,ref=$IMAGE_NAME:$service-cache \
                --cache-to type=registry,ref=$IMAGE_NAME:$service-cache,mode=max \
                --push \
                -t $IMAGE_NAME:$service \
                -f docker/$service.Dockerfile \
                .
            done
      - run:
          name: Build and push RobotServer
          command: |
            docker buildx build \
              --platform=linux/arm64,linux/amd64 \
              --cache-from type=registry,ref=$IMAGE_NAME:robotserver-cache \
              --cache-to type=registry,ref=$IMAGE_NAME:robotserver-cache,mode=max \
              --push \
              -t $IMAGE_NAME:robotserver \
              -f RobotServer/Dockerfile \
              .

workflows:
  version: 2
  build-master:
    jobs:
      - build
