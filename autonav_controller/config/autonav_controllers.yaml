controller_manager:
  ros__parameters:
    update_rate: 20 # Hz
    use_sim_time: false

    autonav_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

autonav_controller:
  ros__parameters:
    type        : diff_drive_controller/DiffDriveController

    left_wheel_names  : ['base2left']
    right_wheel_names : ['base2right']

    publish_rate: 20.0               # default: 50
    pose_covariance_diagonal : [0.001, 0.001, 1.0e-3, 1.0e-3, 1.0e-3, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1.0e-3, 1.0e-3, 1.0e-3, 0.01]

    wheel_separation : 0.265
    wheel_radius : 0.0525

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    open_loop: false

    position_feedback: true

    # Velocity commands timeout [s], default 0.5
    cmd_vel_timeout: 0.5

    # Base frame_id
    base_frame_id: base_footprint #default: base_link

    # Publish limited velocity
    publish_limited_velocity: false

    # Publish wheel data
    publish_wheel_data: true

    # Publish to TF directly or not
    enable_odom_tf: false

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    velocity_rolling_window_size: 10

    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 0.2
    linear.x.max_deceleration: -1.0
    linear.x.max_acceleration_reverse: -0.2
    linear.x.max_deceleration_reverse: 1.0
    linear.x.max_jerk: .NAN
    linear.x.min_jerk: .NAN

    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.max_acceleration: 1.5
    angular.z.max_deceleration: -1.5
    angular.z.max_acceleration_reverse: -1.5
    angular.z.max_deceleration_reverse: 1.5
    angular.z.max_jerk: .NAN
    angular.z.min_jerk: .NAN

