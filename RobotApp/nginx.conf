worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # RobotServer runs with network_mode: host on the robot (see
        # docker-compose.yml) — localhost here is the host's loopback, where
        # RobotServer listens on 8000. Proxying these paths keeps the browser
        # on one origin (this container's), so RobotServer's session cookie
        # (httpOnly, no CORS/SameSite handling — see RobotServer's app.ts)
        # keeps working unchanged.
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        location /health {
            proxy_pass http://127.0.0.1:8000;
        }

        location /maps/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Cookie $http_cookie;
        }

        # WebSocket upgrades (teleop/video topics — see RobotServer's
        # registerTopicsWebSocket/registerVideoWebSocket).
        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_read_timeout 75s;
        }

        # The PWA service worker must never be served with a long cache
        # lifetime, or an updated build can't be picked up on next launch.
        location = /sw.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # SPA fallback for client-side routing.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
