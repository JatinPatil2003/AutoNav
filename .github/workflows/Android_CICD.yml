name: Flutter CI

on:
  push:
    branches: [ "autonav_linux" ]
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4   # use latest version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3" # use your Flutter version

      - name: Install dependencies
        run: flutter pub get
        working-directory: AndroidApp/autonav

      - name: Analyze code
        run: flutter analyze
        working-directory: AndroidApp/autonav

      - name: Build release APK
        run: flutter build apk --release
        working-directory: AndroidApp/autonav

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AutoNav.apk
        working-directory: AndroidApp/autonav

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4   # updated version
        with:
          name: AutoNav-apk
          path: AndroidApp/autonav/build/app/outputs/flutter-apk/AutoNav.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest                # always update the "latest" release
          name: "AutoNav Latest" 
          body: "This release always contains the latest AutoNav.apk build."
          files: AndroidApp/autonav/build/app/outputs/flutter-apk/AutoNav.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

